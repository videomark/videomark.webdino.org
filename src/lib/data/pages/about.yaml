ja:
  meta:
    pageTitle: プロジェクトについて
    pageDescription: Web VideoMark プロジェクトは、動画再生時の再生品質データを分析し、ネットワーク資源の有効活用と品質向上に役立てる調査研究プロジェクトです。
  archive_notice: 下記の通り、体感品質 (QoE) 値の推定と視聴情報の取得は終了させていただきました。
  intro:
    heading: プロジェクトについて
    body: |-
      Web VideoMark プロジェクトは、[世界のインターネット通信の 6 割を占める](https://www.sandvine.com/phenomena) 動画配信サービスを実際に利用して視聴した際の品質データを分析・公開し、ネットワーク資源の有効活用と品質向上に役立てる調査研究プロジェクトです。
  background:
    heading: 背景・目的
    body: |-
      従来、利用者自身がキャリアやプロバイダーなどのネットワーク品質を確認するには、スピードテストのような単純な計測ツールが利用されてきました。しかし、実際のインターネットは通信内容に応じた最適化が広く実施されており、実際のサービス利用時の品質を評価することは難しい状況でした。Web VideoMark ではインターネットで最も帯域を使う実際の動画配信サービス利用時の品質を計測することで、実態に即したネットワーク評価が可能になります。

      本プロジェクトでは、動画配信サービス利用時の再生品質を客観的に推定し、共有・比較できるツールとして、ブラウザーに組み込む [Chrome/Edge 用拡張機能](/chromeextension) (パソコン向け) と [Firefox 用拡張機能](/firefoxextension) (パソコン、Android 向け) を提供しています。これらのツールをインストールしたら AMEBA、Netflix、TVer、YouTube などの [対応サービス](/ja/spec) でいつも通り動画をお楽しみください。動画再生時のビットレート・解像度・フレームレートなどの再生品質パラメーターを記録し、数値として表示します。

      有志の利用者に Web VideoMark のツールで再生品質を計測いただき、集まった再生品質パラメーターやネットワーク情報などの視聴情報は、キャリアやプロバイダーなどの通信事業者や動画配信サービス事業者のサービス品質改善、学術研究のためのデータとして活用・公開してきました。
    image:
      src: https://res.cloudinary.com/videomark/h_300/dino/stand.png
      alt: Dino の挿絵
  architecture:
    heading: 仕組みとプライバシー
    body: |-
      Web VideoMark では利用者が動画配信サービスにアクセスして動画を視聴している時には、ビットレートや解像度の他、再生が滑らかかどうかなどの再生品質情報、通信事業者や ISP などのネットワーク情報、クライアントが PC かモバイルかなどといったクライアント情報などの視聴情報を収集します。

      ブラウザーで収集された視聴情報を元に再生品質を可視化することで、利用者は実際の動画配信サービス利用時の再生品質を確認できます。有志で計測を行っていただいたデータは、キャリアやプロバイダーなどの通信事業者、動画配信サービス運営者によるサービス品質の改善に利用され、インターネットのネットワーク運用、通信品質、サービス品質を研究する学術調査のために公開されてきました。

      Web VideoMark では利用者のプライバシーに最大限の配慮を行い、法律上で個人情報や個人特定情報として扱われる情報を一切保存しないだけでなく、計測結果ログを統計分析などを行っても利用者個人を特定してプライバシー上の問題とならないようにデータを記録しています。

      通信時の IP アドレスも記録前に匿名化処理 (末尾を削除) した上で記録するため、利用者個人を特定する情報となりません。利用者に関する情報は匿名化した IP アドレスとブラウザーのユーザーエージェント文字列から推定しており、GPS などでの高精度な位置情報や、一般のウェブサイトで取得できない端末の情報の取得は行っていません。
    image:
      src: https://res.cloudinary.com/videomark/image/upload/b_rgb:ffffff/videomark-overview.png
      alt: Web VideoMark 概要図
  history:
    heading: 沿革・活動履歴
    body: |-
      Web VideoMark は 2019 年 2 月、有志の一般利用者から動画視聴時のデータを集め、分析・公開する調査研究プロジェクトとして始まりました。

      開始当初から、学会や通信事業者の皆様には、独自のネットワーク品質調査ツールとして個別にご利用いただきました (計測データは非公開)。情報処理学会 IoT 研究会や電子情報通信学会 CQ 研究会をはじめとする研究会で、計測結果を継続的に発表してきました。

      - 2019 年 2 月: OSC 2019 Tokyo/Spring のライトニングトーク「[Web VideoMark Introduction](https://speakerdeck.com/dynamis/web-videomark-introduction)」
      - 2019 年 6 月: 情報処理学会 IoT 研究会 (第 46 回) の招待講演「[Open VideoMark Data](https://speakerdeck.com/dynamis/open-videomark-data)」
      - 2019 年 11 月: 電子情報通信学会 CQ 研究会の合同研究会における招待講演「[VideoMark Analysis](https://speakerdeck.com/dynamis/videomark-analysis)」
      - 2019 年 12 月: IIJ Lab seminar での発表「[Video Streaming Analysis](https://speakerdeck.com/dynamis/video-streaming-analysis)」
      - 2020 年 11 月: [ITU-AJ 第 92 回情報通信研究会](https://www.ituaj.jp/?kouen=92nd_ict) における、NTT コミュニケーションズ株式会社との共同発表「Post COVID-19 Network Analysis」

      その他の発表資料は [Speaker Deck](https://speakerdeck.com/dynamis) で公開しています。

      新型コロナウイルス感染症の感染拡大がインターネットの通信品質に与えた影響を分析し、記事として公開しました (いずれも公開当時の分析です)。

      - [新型コロナウイルス感染拡大に伴う動画視聴行動の変化とネットワークへの影響の初期分析を公開しました](https://www.webdino.org/updates/news/202004250122/) (2020 年 4 月)
      - [動画サービス利用時計測から見る、緊急事態宣言発令後のインターネット品質への影響](https://www.webdino.org/updates/news/202005190116/) (2020 年 5 月)

      動画再生時の品質記録に加え、ネットワークの応答性などを計測する QoS 計測用のスクリプトを実装し、両者を見比べながら分析できる基盤として発展してきました。こうした計測結果をもとに体感品質 (QoE) 値を推定してきました。

      現在の Web VideoMark は、2026 年 3 月末に QoE 推定値の位置づけを見直し、一般の利用者向けには手元で動画の再生品質を計測・記録できるツールとして拡張機能を無償で公開し続けています。個別のネットワーク品質調査をご希望の企業・団体の皆様には、ご相談に応じて視聴情報の送信を有効にした計測版を提供し、計測結果を分析します。
  qoe:
    heading: 体感品質値の推定とデータ取得終了について
    body: |-
      Web VideoMark では、動画再生中の一時停止の有無、解像度やビットレートの変動などを計測し、それらをもとに体感品質 (Quality of Experience, QoE) 値の推定計算を行ってきましたが、2026 年 3 月末をもって体感品質値の推定機能の提供を終了いたしました。

      近年、動画配信を取り巻く環境は大きく変化しています。解像度やコーデックが高度化し、配信方式が多様化しました。ネットワーク品質の指標も増え、再生体験を表すには複数の要素を捉える必要があります。

      こうした状況を踏まえ、本プロジェクトでは体感品質値を中心的な指標として提示するのではなく、再生品質に影響を与える各要素を個別に計測し、より直接的かつ分かりやすく可視化する方針へと見直しを行いました。

      なお、QoE 値の品質推定ロジックは NTTドコモビジネス株式会社から提供いただいたものであり、日本電信電話株式会社ネットワーク基盤技術プロジェクトが開発した視聴状況可視化技術およびサービス品質評価技術を用いることで、客観的な QoE 値の計算を実現していました。この場を借りて関係者の皆様に深く感謝申し上げます。

      また、一般拡張機能利用者からの視聴情報の取得も 2026 年 4 月末をもって終了しました。動画再生時のビットレート・解像度・フレームレートなどの再生品質パラメーターを個別に計測し、数値として表示する機能は今後も引き続きご利用いただけます。
  corporate:
    heading: 法人向け情報
    body: |-
      Web VideoMark プロジェクトを運営する一般社団法人 WebDINO Japan は、ウェブ技術やブラウザーを軸に、企業・研究機関向けの技術支援を行っています。最新のウェブ技術動向を踏まえたコンサルティング、組み込み機器向けのブラウザー移植・カスタマイズ、オープンソース化に関する支援については、[技術サービスのご案内](https://www.webdino.org/services/tech/) をご覧ください。

      ネットワーク事業者や動画配信サービス提供者、研究分析をされる皆様には、より詳細な計測データを提供し、計測内容をご説明します。個別のネットワーク品質調査では、視聴情報の送信を有効にした計測版を提供します。ご関心をお持ちの方は [お問い合わせフォーム](/ja/contact) からご相談ください。
  acknowledgment:
    heading: 謝辞
    body: |-
      Web VideoMark プロジェクトは [一般社団法人 WebDINO Japan](https://www.webdino.org/) が運営しています。本プロジェクトの実現に協力いただいている、各個人・団体・企業の皆様に感謝申し上げます。

      動画配信サービス利用時の視聴情報の取得、分析を行うソフトウェアの開発には [株式会社アクタスソフトウェア](https://www.acutus.jp/) の協力を得ています。各ソフトウェアの開発に協力・貢献いただいているメンバーについてはソースコードを公開している [GitHub](https://github.com/videomark) の各リポジトリをご覧ください。
