ja:
  meta:
    pageTitle: Web VideoMark — 動画の再生品質を確認できるブラウザー向け拡張機能
    pageDescription: Web VideoMark プロジェクトでは、YouTube などの動画配信サービスの視聴時に再生品質を計測可能にするブラウザー拡張機能を提供しています。
  announcement: '体感品質 (QoE) 値の推定は 3 月末をもって終了させていただきました。<a href="/ja/about#qoe">詳しくはこちら</a>'
  hero:
    heading: 動画の再生品質を確認できるブラウザー向け拡張機能
  intro:
    heading: VideoMark でできること
    body_1: |-
      Web VideoMark の計測ツールでは動画の再生時にビットレートや解像度などを記録し、再生品質を推定します。 [Chrome/Edge](/chromeextension) か [Firefox](/firefoxextension) に拡張機能をインストールしたら、YouTube などの [対応サービス](/ja/spec) でいつも通りに動画を見てください。

      ビットレートや解像度、途切れなく再生されるかなどの再生品質が自動的に計測され、動画左上に重ねて表示されます。

      これらの数値は、お使いのキャリアやプロバイダーが実際の動画サービスを快適・高品質に視聴できるネットワーク環境を提供しているか、ある程度の目安とすることができます。
    image_1:
      src: /images/features/video-overlay.webp
      alt: YouTube での計測画面
    body_2: |-
      ブラウザーのツールバーに Web VideoMark ボタンを追加し、これをクリックすると、最近再生した動画を簡単に確認できます。ポップアップの左下にある「すべて見る」をクリックすると、視聴履歴画面が新しいタブで開きます。

      このページでは、すべての対応サービスで再生した動画の計測結果を一覧でき、キーワードでの検索、日時や動画配信サービスごとの絞り込みなどが可能です。また、各動画の詳細な計測結果を見ることもできます。
    image_2:
      src: /images/features/history-list.webp
      alt: 計測結果画面
    more: 詳しい機能と使い方
  about:
    heading: プロジェクトの目的
    body: |-
      Web VideoMark は、[インターネット通信の 6 割を占める](https://www.sandvine.com/phenomena) 動画配信サービスを実際に利用して視聴した際の品質データを分析し、ネットワーク資源の有効活用と品質向上に役立てる調査研究プロジェクトです。2019 年の開始以来、有志の利用者に計測いただいたデータを [統計情報](/ja/stats) や [オープンデータ](/ja/opendata) として公開してきました (いずれも現在は更新を停止したアーカイブです)。

      現在の Web VideoMark は、一般の利用者向けには手元で動画の再生品質を計測・記録できるツールとして拡張機能を無償で公開しています。計測に使用するコードは [オープンソースで公開しています](https://github.com/videomark/)。

      ネットワーク事業者や動画配信サービス提供者、研究分析をされる皆様には、より詳細なデータを提供し、計測内容をご説明します。ご関心をお持ちの方は [お問い合わせフォーム](/ja/contact) からご相談ください。
    image:
      src: https://res.cloudinary.com/videomark/w_400/dino/movie.png
      alt: Dino の挿絵
    more: プロジェクト紹介
